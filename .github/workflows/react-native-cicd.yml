        run: |
          cat > credentials.json <<EOF
          {
            "ios": {
              "provisioningProfilePath": "./my-app.mobileprovision",
              "distributionCertificate": {
                "path": "./my-app.p12",
                "password": "${IOS_CERT_PASSWORD}"
              }
            }
          }
          EOF

      # --------------------------------------------------------
