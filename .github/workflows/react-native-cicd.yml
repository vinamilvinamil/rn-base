name: React Native CI/CD

# ============================================================
# MANUAL BUILD ONLY
# ============================================================

on:
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type"
        required: true
        default: "dev-deploygate"
        options:
          - dev-deploygate
          - prod-deploygate
          - prod-store

      platform:
        type: choice
        description: "Platform"
        required: true
        default: "android"
        options:
          - android
          - ios


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  NODE_OPTIONS: --openssl-legacy-provider


# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # DEVELOPMENT → DEPLOYGATE
  #
  # dev-deploygate + android
  #   → Build Development APK
  #   → Upload DeployGate
  #
  # dev-deploygate + ios
  #   → Build Development IPA
  #   → Upload DeployGate
  # ==========================================================

  dev-deploygate:
    name: Dev DeployGate - ${{ inputs.platform }}

    if: inputs.buildType == 'dev-deploygate'

    environment: development

    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-latest' || 'macos-latest' }}

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: 🏗 Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Node
      # ------------------------------------------------------

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"


      # ------------------------------------------------------
      # Gradle
      # Android only
      # ------------------------------------------------------

      - name: ⚡ Setup Gradle
        if: inputs.platform == 'android'
        uses: gradle/actions/setup-gradle@v4


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: 📦 Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn global add eas-cli@24.3.0


      # ------------------------------------------------------
      # Verify EAS
      # ------------------------------------------------------

      - name: 🔄 Verify EAS CLI
        run: |
          echo "EAS CLI version:"
          eas --version


      # ======================================================
      # ANDROID CREDENTIALS
      # ======================================================

      - name: 🔐 Restore Android Keystore
        if: inputs.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-app.keystore

          if [ ! -s my-app.keystore ]; then
            echo "❌ Android keystore is missing or empty"
            exit 1
          fi

          echo "✅ Android keystore restored"


      - name: 🔐 Create credentials.json
        if: inputs.platform == 'android'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "./my-app.keystore",
                "keystorePassword": "$KEYSTORE_PASSWORD",
                "keyAlias": "$KEY_ALIAS",
                "keyPassword": "$KEY_PASSWORD"
              }
            }
          }
          EOF

          echo "✅ credentials.json created"


      # ======================================================
      # ANDROID DEVELOPMENT
      # ======================================================

      - name: 📱 Build Development Android APK
        if: inputs.platform == 'android'
        env:
          NODE_ENV: development
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          echo "======================================"
          echo "Building Development Android APK"
          echo "Environment: development"
          echo "======================================"

          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform android \
            --profile development \
            --local \
            --non-interactive \
            --output=./app-dev.apk


      # ------------------------------------------------------
      # Upload Android Dev → DeployGate
      # ------------------------------------------------------

      - name: 🚀 Upload Android Dev → DeployGate
        if: inputs.platform == 'android'
        env:
          DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}
          DEPLOYGATE_OWNER_NAME: ${{ secrets.DEPLOYGATE_OWNER_NAME }}
        run: |
          echo "Uploading Development Android APK to DeployGate..."

          curl \
            --fail-with-body \
            --request POST \
            --url "https://deploygate.com/api/users/${DEPLOYGATE_OWNER_NAME}/apps" \
            --header "Authorization: Bearer ${DEPLOYGATE_API_TOKEN}" \
            --form "file=@./app-dev.apk" \
            --form-string "message=Development Android ${GITHUB_SHA}" \
            --form-string "distribution_name=development" \
            --form-string "release_note=Development Android from ${GITHUB_REF_NAME}"

          echo "✅ Development Android APK uploaded"


      # ------------------------------------------------------
      # Android Artifact
      # ------------------------------------------------------

      - name: 📦 Upload Android Artifact
        if: inputs.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-android-${{ github.run_number }}
          path: ./app-dev.apk
          if-no-files-found: error
          retention-days: 7


      # ======================================================
      # IOS DEVELOPMENT
      # ======================================================

      - name: 🍎 Build Development iOS
        if: inputs.platform == 'ios'
        env:
          NODE_ENV: development
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
          EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
        run: |
          echo "======================================"
          echo "Building Development iOS"
          echo "Environment: development"
          echo "======================================"

          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform ios \
            --profile development \
            --local \
            --non-interactive \
            --output=./app-ios-dev.ipa


      # ------------------------------------------------------
      # Upload iOS Dev → DeployGate
      # ------------------------------------------------------

      - name: 🚀 Upload iOS Dev → DeployGate
        if: inputs.platform == 'ios'
        env:
          DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}
          DEPLOYGATE_OWNER_NAME: ${{ secrets.DEPLOYGATE_OWNER_NAME }}
        run: |
          echo "Uploading Development iOS IPA to DeployGate..."

          curl \
            --fail-with-body \
            --request POST \
            --url "https://deploygate.com/api/users/${DEPLOYGATE_OWNER_NAME}/apps" \
            --header "Authorization: Bearer ${DEPLOYGATE_API_TOKEN}" \
            --form "file=@./app-ios-dev.ipa" \
            --form-string "message=Development iOS ${GITHUB_SHA}" \
            --form-string "distribution_name=development" \
            --form-string "release_note=Development iOS from ${GITHUB_REF_NAME}"

          echo "✅ Development iOS IPA uploaded"


      # ------------------------------------------------------
      # iOS Artifact
      # ------------------------------------------------------

      - name: 📦 Upload iOS Artifact
        if: inputs.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-ios-${{ github.run_number }}
          path: ./app-ios-dev.ipa
          if-no-files-found: error
          retention-days: 7


  # ==========================================================
  # PRODUCTION → DEPLOYGATE
  #
  # prod-deploygate + android
  #   → Build Production APK
  #   → Upload DeployGate
  #
  # prod-deploygate + ios
  #   → Build Production IPA
  #   → Upload DeployGate
  # ==========================================================

  prod-deploygate:
    name: Prod DeployGate - ${{ inputs.platform }}

    if: inputs.buildType == 'prod-deploygate'

    environment: production

    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-latest' || 'macos-latest' }}

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: 🏗 Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Node
      # ------------------------------------------------------

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"


      # ------------------------------------------------------
      # Gradle
      # ------------------------------------------------------

      - name: ⚡ Setup Gradle
        if: inputs.platform == 'android'
        uses: gradle/actions/setup-gradle@v4


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: 📦 Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn global add eas-cli@24.3.0


      # ------------------------------------------------------
      # Verify EAS
      # ------------------------------------------------------

      - name: 🔄 Verify EAS CLI
        run: |
          echo "EAS CLI version:"
          eas --version


      # ======================================================
      # ANDROID CREDENTIALS
      # ======================================================

      - name: 🔐 Restore Android Keystore
        if: inputs.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-app.keystore

          if [ ! -s my-app.keystore ]; then
            echo "❌ Android keystore is missing or empty"
            exit 1
          fi

          echo "✅ Android keystore restored"


      - name: 🔐 Create credentials.json
        if: inputs.platform == 'android'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "./my-app.keystore",
                "keystorePassword": "$KEYSTORE_PASSWORD",
                "keyAlias": "$KEY_ALIAS",
                "keyPassword": "$KEY_PASSWORD"
              }
            }
          }
          EOF

          echo "✅ credentials.json created"


      # ======================================================
      # ANDROID PRODUCTION APK
      # ======================================================

      - name: 📱 Build Production Android APK
        if: inputs.platform == 'android'
        env:
          NODE_ENV: production
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          echo "======================================"
          echo "Building Production Android APK"
          echo "Environment: production"
          echo "======================================"

          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform android \
            --profile production-apk \
            --local \
            --non-interactive \
            --output=./app-prod.apk


      # ------------------------------------------------------
      # Upload Android Prod → DeployGate
      # ------------------------------------------------------

      - name: 🚀 Upload Android Prod → DeployGate
        if: inputs.platform == 'android'
        env:
          DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}
          DEPLOYGATE_OWNER_NAME: ${{ secrets.DEPLOYGATE_OWNER_NAME }}
        run: |
          echo "Uploading Production Android APK to DeployGate..."

          curl \
            --fail-with-body \
            --request POST \
            --url "https://deploygate.com/api/users/${DEPLOYGATE_OWNER_NAME}/apps" \
            --header "Authorization: Bearer ${DEPLOYGATE_API_TOKEN}" \
            --form "file=@./app-prod.apk" \
            --form-string "message=Production Android ${GITHUB_SHA}" \
            --form-string "distribution_name=production" \
            --form-string "release_note=Production Android from ${GITHUB_REF_NAME}"

          echo "✅ Production Android APK uploaded"


      # ------------------------------------------------------
      # Android Artifact
      # ------------------------------------------------------

      - name: 📦 Upload Android Artifact
        if: inputs.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-android-${{ github.run_number }}
          path: ./app-prod.apk
          if-no-files-found: error
          retention-days: 7


      # ======================================================
      # IOS PRODUCTION
      # ======================================================

      - name: 🍎 Build Production iOS
        if: inputs.platform == 'ios'
        env:
          NODE_ENV: production
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
          EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
        run: |
          echo "======================================"
          echo "Building Production iOS"
          echo "Environment: production"
          echo "======================================"

          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output=./app-ios-prod.ipa


      # ------------------------------------------------------
      # Upload iOS Prod → DeployGate
      # ------------------------------------------------------

      - name: 🚀 Upload iOS Prod → DeployGate
        if: inputs.platform == 'ios'
        env:
          DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}
          DEPLOYGATE_OWNER_NAME: ${{ secrets.DEPLOYGATE_OWNER_NAME }}
        run: |
          echo "Uploading Production iOS IPA to DeployGate..."

          curl \
            --fail-with-body \
            --request POST \
            --url "https://deploygate.com/api/users/${DEPLOYGATE_OWNER_NAME}/apps" \
            --header "Authorization: Bearer ${DEPLOYGATE_API_TOKEN}" \
            --form "file=@./app-ios-prod.ipa" \
            --form-string "message=Production iOS ${GITHUB_SHA}" \
            --form-string "distribution_name=production" \
            --form-string "release_note=Production iOS from ${GITHUB_REF_NAME}"

          echo "✅ Production iOS IPA uploaded"


      # ------------------------------------------------------
      # iOS Artifact
      # ------------------------------------------------------

      - name: 📦 Upload iOS Artifact
        if: inputs.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-ios-${{ github.run_number }}
          path: ./app-ios-prod.ipa
          if-no-files-found: error
          retention-days: 7


  # ==========================================================
  # PRODUCTION → STORE
  #
  # prod-store + android
  #   → Build AAB
  #   → Submit Google Play
  #
  # prod-store + ios
  #   → Build IPA
  #   → Submit App Store
  # ==========================================================

  prod-store:
    name: Prod Store - ${{ inputs.platform }}

    if: inputs.buildType == 'prod-store'

    environment: production

    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-latest' || 'macos-latest' }}

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: 🏗 Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Node
      # ------------------------------------------------------

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"


      # ------------------------------------------------------
      # Gradle
      # ------------------------------------------------------

      - name: ⚡ Setup Gradle
        if: inputs.platform == 'android'
        uses: gradle/actions/setup-gradle@v4


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: 📦 Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn global add eas-cli@24.3.0


      # ------------------------------------------------------
      # Verify EAS
      # ------------------------------------------------------

      - name: 🔄 Verify EAS CLI
        run: |
          echo "EAS CLI version:"
          eas --version


      # ======================================================
      # ANDROID CREDENTIALS
      # ======================================================

      - name: 🔐 Restore Android Keystore
        if: inputs.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-app.keystore

          if [ ! -s my-app.keystore ]; then
            echo "❌ Android keystore is missing or empty"
            exit 1
          fi

          echo "✅ Android keystore restored"


      - name: 🔐 Create credentials.json
        if: inputs.platform == 'android'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "./my-app.keystore",
                "keystorePassword": "$KEYSTORE_PASSWORD",
                "keyAlias": "$KEY_ALIAS",
                "keyPassword": "$KEY_PASSWORD"
              }
            }
          }
          EOF

          echo "✅ credentials.json created"


      # ======================================================
      # ANDROID → GOOGLE PLAY
      # ======================================================

      - name: 📱 Build Production Android AAB
        if: inputs.platform == 'android'
        env:
          NODE_ENV: production
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          echo "======================================"
          echo "Building Production Android AAB"
          echo "Environment: production"
          echo "======================================"

          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output=./app-prod.aab


      # ------------------------------------------------------
      # Upload Android Store Artifact
      # ------------------------------------------------------

      - name: 📦 Upload Android AAB Artifact
        if: inputs.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-store-android-${{ github.run_number }}
          path: ./app-prod.aab
          if-no-files-found: error
          retention-days: 7


      # ------------------------------------------------------
      # Google Play
      # ------------------------------------------------------

      - name: 🚀 Submit to Google Play Store
        if: inputs.platform == 'android'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          echo "Submitting AAB to Google Play..."

          eas submit \
            --platform android \
            --path ./app-prod.aab \
            --non-interactive

          echo "✅ Google Play submission completed"


      # ======================================================
      # IOS → APP STORE
      # ======================================================

      - name: 🍎 Build Production iOS
        if: inputs.platform == 'ios'
        env:
          NODE_ENV: production
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
          EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
        run: |
          echo "======================================"
          echo "Building Production iOS"
          echo "Environment: production"
          echo "======================================"

          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output=./app-ios-prod.ipa


      # ------------------------------------------------------
      # Upload iOS Store Artifact
      # ------------------------------------------------------

      - name: 📦 Upload iOS IPA Artifact
        if: inputs.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-store-ios-${{ github.run_number }}
          path: ./app-ios-prod.ipa
          if-no-files-found: error
          retention-days: 7


      # ------------------------------------------------------
      # Apple App Store
      # ------------------------------------------------------

      - name: 🚀 Submit to Apple App Store
        if: inputs.platform == 'ios'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
          EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
        run: |
          echo "Submitting IPA to App Store..."

          eas submit \
            --platform ios \
            --path ./app-ios-prod.ipa \
            --non-interactive

          echo "✅ App Store submission completed"