name: React Native CI/CD

on:
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type"
        required: true
        default: "dev-deploygate"
        options:
          - dev-deploygate
          - prod-deploygate
          - prod-store

      platform:
        type: choice
        description: "Platform"
        required: true
        default: "android"
        options:
          - android
          - ios

env:
  NODE_OPTIONS: --openssl-legacy-provider


# ============================================================
# DEV - DEPLOYGATE - ANDROID
# ============================================================
jobs:

  dev-deploygate-android:
    name: Dev DeployGate - Android
    if: inputs.buildType == 'dev-deploygate' && inputs.platform == 'android'
    environment: development
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node
      # --------------------------------------------------------
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------
      - name: ⚡ Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      # --------------------------------------------------------
      # EAS CLI
      # --------------------------------------------------------
      - name: 🔧 Install EAS CLI
        run: yarn global add eas-cli@24.3.0

      - name: 🔍 Check EAS CLI
        run: eas --version

      # --------------------------------------------------------
      # Create Expo .env from GitHub Environment Variables
      # --------------------------------------------------------
      - name: 🌱 Create .env
        run: |
          echo '${{ toJSON(vars) }}' \
            | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' \
            > .env

          # Chỉ giữ env dùng cho Expo
          grep -E '^(APP_ENV|EXPO_PUBLIC_)' .env > .env.filtered
          mv .env.filtered .env

          echo "========== ENV CHECK =========="
          wc -l .env
          grep -E '^(APP_ENV|EXPO_PUBLIC_)' .env | sed 's/=.*/=***SET***/'

      # --------------------------------------------------------
      # Restore Android Keystore
      # --------------------------------------------------------
      - name: 🔐 Restore Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-app.keystore
          ls -lh my-app.keystore

      # --------------------------------------------------------
      # Create credentials.json
      # --------------------------------------------------------
      - name: 🔐 Create Android credentials.json
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "./my-app.keystore",
                "keystorePassword": "${ANDROID_KEYSTORE_PASSWORD}",
                "keyAlias": "${ANDROID_KEY_ALIAS}",
                "keyPassword": "${ANDROID_KEY_PASSWORD}"
              }
            }
          }
          EOF
      - name: 🧪 Test Expo public env
        run: |
          node -e "
            const fs = require('fs');

            console.log('========== FILE CHECK ==========');
            console.log('env exists:', fs.existsSync('.env'));

            console.log('========== ENV FILE ==========');
            console.log(fs.readFileSync('.env', 'utf8'));
          "

          echo "========== EXPO CONFIG =========="
          npx expo config --type public
      - name: 🧪 Verify Expo env injection
        run: |
          node -e "
            console.log('SUPABASE_URL:', process.env.EXPO_PUBLIC_SUPABASE_URL);
            console.log('SUPABASE_KEY:', process.env.EXPO_PUBLIC_SUPABASE_KEY ? '***SET***' : 'MISSING');
          "
      # --------------------------------------------------------
      # Build APK
      # --------------------------------------------------------
      - name: 🏗️ Build Development Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Load toàn bộ .env vào process.env
          set -a
          source .env
          set +a

          echo "========== PROCESS ENV CHECK =========="
          echo "APP_ENV=$APP_ENV"
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL"
          echo "EXPO_PUBLIC_SUPABASE_KEY=${EXPO_PUBLIC_SUPABASE_KEY:+***SET***}"

          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform android \
            --profile development \
            --local \
            --non-interactive \
            --output=./app-dev.apk

      # --------------------------------------------------------
      # Verify APK
      # --------------------------------------------------------
      - name: 🔍 Check APK
        run: |
          pwd
          ls -lah
          test -f ./app-dev.apk

      # --------------------------------------------------------
      # GitHub Artifact
      # --------------------------------------------------------
      - name: 📦 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-android-${{ github.run_number }}
          path: ./app-dev.apk
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------------------
      # DeployGate
      # --------------------------------------------------------
      - name: 🚀 Upload Development APK to DeployGate
        env:
          DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}
          DEPLOYGATE_OWNER_NAME: ${{ secrets.DEPLOYGATE_OWNER_NAME }}
        run: |
          curl \
            --fail-with-body \
            --request POST \
            --url "https://deploygate.com/api/users/${DEPLOYGATE_OWNER_NAME}/apps" \
            --header "Authorization: Bearer ${DEPLOYGATE_API_TOKEN}" \
            --form "file=@./app-dev.apk" \
            --form-string "message=Development Android ${GITHUB_SHA}" \
            --form-string "distribution_name=development" \
            --form-string "release_note=Development Android from ${GITHUB_REF_NAME}"


  # ============================================================
  # DEV - EAS BUILD - IOS
  # ============================================================

  dev-deploygate-ios:
    name: Dev DeployGate - iOS
    if: inputs.buildType == 'dev-deploygate' && inputs.platform == 'ios'
    environment: development
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node
      # --------------------------------------------------------
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      # --------------------------------------------------------
      # EAS CLI
      # --------------------------------------------------------
      - name: 🔧 Install EAS CLI
        run: yarn global add eas-cli@24.3.0

      - name: 🔍 Check EAS CLI
        run: eas --version

      # --------------------------------------------------------
      # Create Expo .env from GitHub Environment Variables
      # --------------------------------------------------------
      - name: 🌱 Create .env
        run: |
          printenv \
            | grep -E '^(APP_ENV|EXPO_PUBLIC_)' \
            | sort \
            > .env

          echo "Generated Expo environment variables:"
          cut -d '=' -f1 .env

      # --------------------------------------------------------
      # Build on EAS Cloud
      # --------------------------------------------------------
      - name: 🏗️ Build Development iOS on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ios \
            --profile development \
            --non-interactive \
            --wait

  # ============================================================
  # DEV - DEPLOYGATE - IOS
  # ============================================================
  dev-deploygate-ios-local:
    name: Dev DeployGate - iOS
    if: inputs.buildType == 'dev-deploygate-local' && inputs.platform == 'ios'
    environment: development
    runs-on: macos-latest

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: ⚡ Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 🔧 Install EAS CLI
        run: yarn global add eas-cli@24.3.0

      - name: 🔍 Check EAS CLI
        run: eas --version

      - name: 🔐 Create iOS credentials.json
        env:
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "ios": {
              "provisioningProfilePath": "./my-app.mobileprovision",
              "distributionCertificate": {
                "path": "./my-app.p12",
                "password": "${IOS_CERT_PASSWORD}"
              }
            }
          }
          EOF

      # --------------------------------------------------------
      # Create Expo .env from GitHub Environment Variables
      # --------------------------------------------------------
      - name: 🌱 Create .env
        run: |
          printenv \
            | grep -E '^(APP_ENV|EXPO_PUBLIC_)' \
            | sort \
            > .env

          echo "Generated Expo environment variables:"
          cut -d '=' -f1 .env

      # --------------------------------------------------------
      # Build iOS IPA
      # --------------------------------------------------------
      - name: 🏗️ Build Development iOS IPA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
          EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform ios \
            --profile development \
            --local \
            --non-interactive \
            --output=./app-ios-dev.ipa

      # --------------------------------------------------------
      # Verify IPA
      # --------------------------------------------------------
      - name: 🔍 Check IPA
        run: |
          pwd
          ls -lah
          test -f ./app-ios-dev.ipa

      # --------------------------------------------------------
      # GitHub Artifact
      # --------------------------------------------------------
      - name: 📦 Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-ios-${{ github.run_number }}
          path: ./app-ios-dev.ipa
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------------------
      # DeployGate
      # --------------------------------------------------------
      - name: 🚀 Upload Development IPA to DeployGate
        env:
          DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}
          DEPLOYGATE_OWNER_NAME: ${{ secrets.DEPLOYGATE_OWNER_NAME }}
        run: |
          curl \
            --fail-with-body \
            --request POST \
            --url "https://deploygate.com/api/users/${DEPLOYGATE_OWNER_NAME}/apps" \
            --header "Authorization: Bearer ${DEPLOYGATE_API_TOKEN}" \
            --form "file=@./app-ios-dev.ipa" \
            --form-string "message=Development iOS ${GITHUB_SHA}" \
            --form-string "distribution_name=development" \
            --form-string "release_note=Development iOS from ${GITHUB_REF_NAME}"


  # ============================================================
  # PROD - DEPLOYGATE - ANDROID
  # ============================================================

  prod-deploygate-android:
    name: Prod DeployGate - Android
    if: inputs.buildType == 'prod-deploygate' && inputs.platform == 'android'
    environment: production
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: ⚡ Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔧 Install EAS CLI
        run: yarn global add eas-cli@24.3.0

      - name: 🔍 Check EAS CLI
        run: eas --version

      # --------------------------------------------------------
      # Create Expo .env from GitHub Environment Variables
      # --------------------------------------------------------
      - name: 🌱 Create .env
        run: |
          # 1. Chuyển object JSON vars từ GitHub thành định dạng KEY=VALUE và lưu vào .env
          echo '${{ toJSON(vars) }}' | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' > .env
          
          # 2. Lọc lại các biến theo chuẩn Expo của bạn (nếu muốn)
          # Lệnh này giữ lại các dòng chứa APP_ENV hoặc EXPO_PUBLIC_
          grep -E '^(APP_ENV|EXPO_PUBLIC_)' .env > .env.filtered && mv .env.filtered .env

          # 3. Kiểm tra kết quả trong log
          echo "========== GENERATED .env CONTENT =========="
          cat .env

      # --------------------------------------------------------
      # Restore Android Keystore
      # --------------------------------------------------------
      - name: 🔐 Restore Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-app.keystore
          ls -lh my-app.keystore

      # --------------------------------------------------------
      # Create credentials.json
      # --------------------------------------------------------
      - name: 🔐 Create Android credentials.json
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "./my-app.keystore",
                "keystorePassword": "${ANDROID_KEYSTORE_PASSWORD}",
                "keyAlias": "${ANDROID_KEY_ALIAS}",
                "keyPassword": "${ANDROID_KEY_PASSWORD}"
              }
            }
          }
          EOF

      # --------------------------------------------------------
      # Build Production APK
      # --------------------------------------------------------
      - name: 🏗️ Build Production Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform android \
            --profile production-apk \
            --local \
            --non-interactive \
            --output=./app-prod.apk

      - name: 🔍 Check APK
        run: |
          pwd
          ls -lah
          test -f ./app-prod.apk

      # --------------------------------------------------------
      # GitHub Artifact
      # --------------------------------------------------------
      - name: 📦 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-android-${{ github.run_number }}
          path: ./app-prod.apk
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------------------
      # DeployGate
      # --------------------------------------------------------
      - name: 🚀 Upload Production APK to DeployGate
        env:
          DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}
          DEPLOYGATE_OWNER_NAME: ${{ secrets.DEPLOYGATE_OWNER_NAME }}
        run: |
          curl \
            --fail-with-body \
            --request POST \
            --url "https://deploygate.com/api/users/${DEPLOYGATE_OWNER_NAME}/apps" \
            --header "Authorization: Bearer ${DEPLOYGATE_API_TOKEN}" \
            --form "file=@./app-prod.apk" \
            --form-string "message=Production Android ${GITHUB_SHA}" \
            --form-string "distribution_name=production" \
            --form-string "release_note=Production Android from ${GITHUB_REF_NAME}"


  # ============================================================
  # PROD - DEPLOYGATE - IOS
  # ============================================================

  prod-deploygate-ios:
    name: Prod DeployGate - iOS
    if: inputs.buildType == 'prod-deploygate' && inputs.platform == 'ios'
    environment: production
    runs-on: macos-latest

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: ⚡ Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 🔧 Install EAS CLI
        run: yarn global add eas-cli@24.3.0

      - name: 🔍 Check EAS CLI
        run: eas --version

      - name: 🔐 Create iOS credentials.json
        env:
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "ios": {
              "provisioningProfilePath": "./my-app.mobileprovision",
              "distributionCertificate": {
                "path": "./my-app.p12",
                "password": "${IOS_CERT_PASSWORD}"
              }
            }
          }
          EOF

      # --------------------------------------------------------
