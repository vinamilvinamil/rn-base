      # --------------------------------------------------------
      # Build Production IPA
      # --------------------------------------------------------
      - name: 🏗️ Build Production iOS IPA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
          EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output=./app-ios-prod.ipa

      - name: 🔍 Check IPA
        run: |
          pwd
          ls -lah
          test -f ./app-ios-prod.ipa

      # --------------------------------------------------------
      # GitHub Artifact
      # --------------------------------------------------------
      - name: 📦 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-store-ios-${{ github.run_number }}
          path: ./app-ios-prod.ipa
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------------------
      # App Store
      # --------------------------------------------------------
      - name: 🚀 Submit iOS to App Store
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
          EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
        run: |
          eas submit \
            --platform ios \
            --path ./app-ios-prod.ipa \
            --non-interactive