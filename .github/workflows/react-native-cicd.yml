          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------------------
      # Google Play
      # --------------------------------------------------------
      - name: 🚀 Submit Android to Google Play
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          eas submit \
            --platform android \
            --path ./app-prod.aab \
            --non-interactive


