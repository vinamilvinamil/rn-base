        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-app.keystore
          ls -lh my-app.keystore

      # --------------------------------------------------------
      # Create credentials.json
      # --------------------------------------------------------
      - name: 🔐 Create Android credentials.json
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "./my-app.keystore",
                "keystorePassword": "${ANDROID_KEYSTORE_PASSWORD}",
                "keyAlias": "${ANDROID_KEY_ALIAS}",
                "keyPassword": "${ANDROID_KEY_PASSWORD}"
              }
            }
          }
          EOF

      # --------------------------------------------------------
      # Build AAB
      # --------------------------------------------------------
      - name: 🏗️ Build Production Android AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output=./app-prod.aab

      - name: 🔍 Check AAB
        run: |
